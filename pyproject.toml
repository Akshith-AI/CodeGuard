[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "0.1.0"
description = "AI-powered security scanner for Python code in public GitHub repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.66", "anthropic>=0.49", "PyGithub>=2.0", "python-dotenv>=1.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
